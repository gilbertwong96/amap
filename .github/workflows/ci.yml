name: CI

on:
  push:
    # Pushes to the default branch only: pull requests already run this, and the
    # coverage badge no longer needs a branch of its own to write to.
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --all-warnings --warnings-as-errors
      - run: mix test

  quality:
    runs-on: ubuntu-latest
    name: Quality
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      # Dialyzer's PLT takes minutes to build from scratch, so it is cached
      # against the toolchain and the lockfile. Casing on mix.lock means a
      # dependency change rebuilds it rather than checking against a stale one.
      - uses: actions/cache@v6
        with:
          path: _build/test/dialyxir_*.plt*
          key: plt-${{runner.os}}-otp28-elixir1.19-${{hashFiles('mix.lock')}}

      - run: mix deps.get
      - run: mix ci

      # The gate is the check at the end of this step, not a key in mix.exs:
      # measured, `mix coveralls.json` does not enforce `minimum_coverage`.
      # Codecov ingests the cover/excoveralls.json this writes, and `mix test
      # --cover` alone writes no such file.
      - name: Run tests with coverage
        run: |
          set -euo pipefail
          mix coveralls.json | tee coveralls.txt
          total=$(sed -n 's/^\[TOTAL\] *\([0-9.]*\)%.*/\1/p' coveralls.txt | tail -1)
          test -n "$total"
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 < 93) }'

      # Codecov's own action rather than the curl uploader: the bash uploader the
      # reference repo still uses is deprecated upstream. `files:` is this major's
      # input name — read from the action's own action.yml rather than assumed. An
      # upload that fails only warns (fail_ci_if_error defaults to false) and
      # continue-on-error is kept as a second belt, because a fork's pull request
      # gets no secret at all; the JSON is kept as an artifact either way.
      - name: Post coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./cover/excoveralls.json
          verbose: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux
          path: cover/excoveralls.json
          retention-days: 30
